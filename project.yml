name: FlowTrace

options:
  minimumXcodeGenVersion: 2.44.0
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "11.0"

targets:
  FlowTrace:
    type: application
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: FlowTraceForMac
        excludes:
          - Info.plist
          - FlowTraceForMac.entitlements
          - Assets.xcassets
          - "Preview Content"
          # All .lproj folders are listed as explicit resources below.
          - "*.lproj"
      - path: FlowTrace
      - path: FlowTraceForMac/Assets.xcassets
        buildPhase: resources
      - path: FlowTraceForMac/Preview Content/Preview Assets.xcassets
        buildPhase: resources
      - path: FlowTraceForMac/Base.lproj/Main.storyboard
        buildPhase: resources
      - path: FlowTraceForMac/en.lproj
        buildPhase: resources
      - path: FlowTraceForMac/zh-Hans.lproj
        buildPhase: resources
      - path: FlowTraceForMac/zh-Hant.lproj
        buildPhase: resources
      - path: FlowTraceForMac/es.lproj
        buildPhase: resources
      - path: FlowTraceForMac/pt-BR.lproj
        buildPhase: resources
      - path: FlowTraceForMac/fr.lproj
        buildPhase: resources
      - path: FlowTraceForMac/de.lproj
        buildPhase: resources
      - path: FlowTraceForMac/it.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ru.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ja.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ko.lproj
        buildPhase: resources
      - path: FlowTraceForMac/vi.lproj
        buildPhase: resources
      - path: FlowTraceForMac/hi.lproj
        buildPhase: resources
      - path: FlowTraceForMac/bn.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ur.lproj
        buildPhase: resources
      - path: FlowTraceForMac/pa.lproj
        buildPhase: resources
      - path: FlowTraceForMac/mr.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ta.lproj
        buildPhase: resources
      - path: FlowTraceForMac/jv.lproj
        buildPhase: resources
      - path: FlowTraceForMac/ar.lproj
        buildPhase: resources
      - path: FlowTraceForMac/fa.lproj
        buildPhase: resources
    entitlements:
      path: FlowTraceForMac/FlowTraceForMac.entitlements
    settings:
      base:
        PRODUCT_NAME: FlowTrace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Intentionally NOT setting GLOBAL_ACCENT_COLOR_NAME. When it
        # points at the bundled AccentColor.colorset (a hardcoded
        # #00CFFF), the asset's value becomes the AppKit control
        # accent at launch and overrides `.tint(nil)` at the root —
        # i.e. the "Follow system" branch could never fall back to the
        # macOS accent. Dropping the setting lets our `accentColorTint`
        # extension be the single source of truth.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_ASSET_PATHS: "\"FlowTraceForMac/Preview Content\""
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: FlowTraceForMac/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: local.FlowTrace
        SWIFT_VERSION: 5.0
      configs:
        # Notarisation requires the hardened runtime. Release only — on Debug it
        # would block the debugger unless Xcode injects get-task-allow.
        # CODE_SIGN_IDENTITY stays ad-hoc ("-") above so a fresh clone builds
        # without a certificate. Release builds override the identity on the
        # command line instead, and the packaging / notarisation steps are run
        # by hand — see AGENTS.md § Releases. Do not hard-code an identity here:
        # it would break the build for anyone who does not have that certificate.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  FlowTraceTests:
    # Pure-Swift unit tests. No UI, no AppKit, no SwiftUI — `ListViewModel.sort`
    # is value-in / value-out so the test target only needs the model layer.
    # We do *not* need access to `SharedStore` (the singleton) for the
    # sort tests; ListViewModel is constructed with default values, the
    # globalModel reference is unused by sort(), and the test never calls
    # updateData. If a future test wants SharedStore, instantiate it in
    # a setUp() with a fresh ListViewModel attached.
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - path: FlowTraceTests
    dependencies:
      - target: FlowTrace
    settings:
      base:
        # Must be set per target. When PRODUCT_NAME lived in the top-level
        # `settings.base` it applied to *both* targets, so the test bundle
        # produced a `FlowTrace.swiftmodule` identical to the app's and
        # `xcodebuild test` died with "Multiple commands produce
        # .../FlowTrace.swiftmodule/arm64-apple-macos.swiftmodule".
        PRODUCT_NAME: FlowTraceTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlowTrace.app/Contents/MacOS/FlowTrace"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  FlowTrace:
    build:
      targets:
        FlowTrace: all
    run:
      config: Debug
    analyze:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - FlowTraceTests
